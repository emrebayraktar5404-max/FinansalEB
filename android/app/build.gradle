plugins {
    id 'com.android.application'
}

import java.util.Properties

android {
    namespace 'com.finansaleb.app'
    compileSdk 35

    buildFeatures { buildConfig = true }

    defaultConfig {
        applicationId 'com.finansaleb.app'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '0.3.5'
    }

    def signingProperties = new Properties()
    def signingPropertiesFile = rootProject.file('signing/keystore.properties')
    def hasPersonalSigning = signingPropertiesFile.exists()
    if (hasPersonalSigning) signingProperties.load(new FileInputStream(signingPropertiesFile))

    signingConfigs {
        if (hasPersonalSigning) {
            personal {
                storeFile rootProject.file("signing/${signingProperties['storeFile']}")
                storePassword signingProperties['storePassword']
                keyAlias signingProperties['keyAlias']
                keyPassword signingProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            if (hasPersonalSigning) signingConfig signingConfigs.personal
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging { resources.excludes += ['META-INF/*'] }
}
