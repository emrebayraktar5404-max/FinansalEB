plugins {
    id 'com.android.application'
}

/*
 * Kişisel imzalama isteğe bağlıdır.
 *
 * GitHub Actions'ta kişisel keystore bulunmuyorsa
 * debug APK Android'in varsayılan debug keystore'u ile oluşturulur.
 */

def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file('signing/keystore.properties')
def hasPersonalSigning = signingPropertiesFile.exists()

if (hasPersonalSigning) {
    signingProperties.load(new FileInputStream(signingPropertiesFile))
}

android {
    namespace 'com.finansaleb.app'
    compileSdk 35

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId 'com.finansaleb.app'
        minSdk 26
        targetSdk 35

        // v0.3.0
        versionCode 3
        versionName '0.3.0'
    }

    /*
     * Kişisel imza sadece dosya mevcutsa oluşturulur.
     */
    signingConfigs {
        if (hasPersonalSigning) {
            personal {
                storeFile rootProject.file("signing/${signingProperties['storeFile']}")
                storePassword signingProperties['storePassword']
                keyAlias signingProperties['keyAlias']
                keyPassword signingProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'

            /*
             * Kişisel imza varsa onu kullan.
             * Yoksa Android'in standart debug imzasını kullan.
             */
            if (hasPersonalSigning) {
                signingConfig signingConfigs.personal
            }
        }

        release {
            minifyEnabled false

            /*
             * Kişisel keystore varsa release'i onunla imzala.
             * Yoksa release APK'nın derlenmesini engelleme.
             */
            if (hasPersonalSigning) {
                signingConfig signingConfigs.personal
            }

            proguardFiles(
                getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro'
            )
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources.excludes += ['META-INF/*']
    }
}
