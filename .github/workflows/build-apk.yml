name: FinansalEB Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release-apk:
    name: İmzalı güncellenebilir APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Android 35 paketlerini kur
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Web arayüzünü Android varlıklarına eşitle
        run: bash scripts/sync-assets.sh

      - name: Sürüm doğrula
        run: |
          grep -q "APP_VERSION = '0.3.6'" web/app.js
          grep -q "versionName '0.3.6'" android/app/build.gradle
          echo "v0.3.6 kaynakları doğrulandı"

      - name: Kalıcı imza anahtarını hazırla
        env:
          FILE_PASSWORD: ${{ secrets.FINANSALEB_KEYSTORE_FILE_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.FINANSALEB_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FINANSALEB_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FINANSALEB_KEY_PASSWORD }}
        run: |
          mkdir -p android/signing

          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in android/signing/finansaleb-release.p12.enc \
            -out android/signing/finansaleb-release.p12 \
            -pass env:FILE_PASSWORD

          keytool -list \
            -keystore android/signing/finansaleb-release.p12 \
            -storetype PKCS12 \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          cat > android/signing/keystore.properties <<EOF
          storeFile=finansaleb-release.p12
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: İmzalı APK derle
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: APK dosyasını hazırla
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/FinansalEB-v0.3.6.apk
          sha256sum dist/FinansalEB-v0.3.6.apk > dist/FinansalEB-v0.3.6.apk.sha256

      - name: APK artefaktını yükle
        uses: actions/upload-artifact@v4
        with:
          name: FinansalEB-v0.3.6-APK
          path: dist/
          if-no-files-found: error
          retention-days: 30
