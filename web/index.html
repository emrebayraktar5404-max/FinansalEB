<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Finansal(EB)</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand-wrap"><button id="moreBtn" class="plain-icon-btn" aria-label="Menüyü aç"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><button id="searchBtn" class="plain-icon-btn" aria-label="Ara"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></button><div id="syncText" class="sync-line">FinansalEB</div></div>
      <div class="top-actions">
        <button id="privacyBtn" class="icon-btn" aria-label="Gizlilik modu" title="Gizlilik modu"></button>
        <button id="syncBtn" class="icon-btn sync-btn" aria-label="Verileri yenile" title="Verileri yenile"></button>
        <button id="profileBtn" class="avatar-btn" aria-label="Profil ve ayarlar">EB</button>
      </div>
    </header>

    <main id="page" class="page" aria-live="polite"></main>

    <button id="fab" class="fab" aria-label="Yeni işlem ekle"></button>

    <nav id="bottomNav" class="bottom-nav" aria-label="Ana menü">
      <button data-page="calendar" class="nav-item active"><span class="nav-icon" data-icon="calendar"></span><span>Takvim</span></button>
      <button data-page="discover" class="nav-item"><span class="nav-icon" data-icon="market"></span><span>Keşfet</span></button>
      <button data-page="portfolio" class="nav-item"><span class="nav-icon" data-icon="portfolio"></span><span>Portföy</span></button>
      <button data-page="tools" class="nav-item"><span class="nav-icon" data-icon="analytics"></span><span>Araçlar</span></button>
      <button data-page="market" class="nav-item"><span class="nav-icon" data-icon="trend"></span><span>Piyasalar</span></button>
    </nav>
  </div>

  <div id="modalLayer" class="modal-layer" aria-hidden="true"></div>
  <div id="toast" class="toast" role="status"></div>
  <input id="importInput" type="file" accept="application/json,.json" hidden>
  <script src="finance-core.js"></script>
  <script src="app.js"></script>
</body>
</html>
