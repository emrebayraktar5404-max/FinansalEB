<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#07131b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Finansal(EB)</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand-wrap">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48"><path d="M10 34V15.5c0-2.5 2-4.5 4.5-4.5H31l7 7v16c0 2.2-1.8 4-4 4H14c-2.2 0-4-1.8-4-4Z"/><path d="M18 30.5 23 25l4 3 6-8"/><path d="m30 20 3-1-1 3"/></svg>
        </div>
        <div>
          <div class="brand-name">Finansal<span>(EB)</span></div>
          <div id="syncText" class="sync-line">Yerel ve özel portföy</div>
        </div>
      </div>
      <div class="top-actions">
        <button id="privacyBtn" class="icon-btn" aria-label="Gizlilik modu" title="Gizlilik modu"></button>
        <button id="syncBtn" class="icon-btn sync-btn" aria-label="Verileri yenile" title="Verileri yenile"></button>
        <button id="moreBtn" class="avatar-btn" aria-label="Ayarlar">EB</button>
      </div>
    </header>

    <main id="page" class="page" aria-live="polite"></main>

    <button id="fab" class="fab" aria-label="Yeni işlem ekle"></button>

    <nav id="bottomNav" class="bottom-nav" aria-label="Ana menü">
      <button data-page="dashboard" class="nav-item active"><span class="nav-icon" data-icon="home"></span><span>Özet</span></button>
      <button data-page="portfolio" class="nav-item"><span class="nav-icon" data-icon="portfolio"></span><span>Portföy</span></button>
      <button data-page="dividends" class="nav-item"><span class="nav-icon" data-icon="dividend"></span><span>Temettü</span></button>
      <button data-page="calendar" class="nav-item"><span class="nav-icon" data-icon="calendar"></span><span>Takvim</span></button>
      <button data-page="market" class="nav-item"><span class="nav-icon" data-icon="market"></span><span>Piyasa</span></button>
      <button data-page="analytics" class="nav-item"><span class="nav-icon" data-icon="analytics"></span><span>Analiz</span></button>
    </nav>
  </div>

  <div id="modalLayer" class="modal-layer" aria-hidden="true"></div>
  <div id="toast" class="toast" role="status"></div>
  <input id="importInput" type="file" accept="application/json,.json" hidden>
  <script src="app.js"></script>
</body>
</html>
